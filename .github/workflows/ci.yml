name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Cargo fmt
        run: cargo fmt --all --check
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Cargo check
        run: cargo check --locked --workspace
      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Cargo test (existing contracts)
        run: cargo test --locked --workspace -- --skip target_contract_
      - name: Prepare Linux FFmpeg toolchain
        run: cargo xtask toolchain ffmpeg --platform linux-x86_64
      - name: Xtask full verify
        run: cargo xtask verify full

  insertion-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            at-spi2-core \
            dbus-x11 \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xauth \
            xvfb
      - name: Linux insertion contract
        env:
          TYPEVOICE_T23_ISOLATED: "1"
        run: env -u WAYLAND_DISPLAY -u AT_SPI_BUS_ADDRESS GDK_BACKEND=x11 NO_AT_BRIDGE=0 dbus-run-session -- xvfb-run -a cargo xtask verify insertion-contract

  insertion-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
      - name: Windows insertion contract
        env:
          TYPEVOICE_T23_ISOLATED: "1"
          TYPEVOICE_T23_WINDOWS_VM: "1"
        run: cargo xtask verify insertion-contract

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        working-directory: apps/desktop
        run: npm ci
      - name: Audit
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate
      - name: Build
        working-directory: apps/desktop
        run: npm run build
